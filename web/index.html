<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摄影选片 · 电脑上传</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="brand">摄影选片 · 电脑上传</div>
      <div class="steps" id="steps">
        <span class="s on" data-step="1">1</span><span class="t on">上传码</span>
        <span class="sep">›</span>
        <span class="s" data-step="2">2</span><span class="t">选照片</span>
        <span class="sep">›</span>
        <span class="s" data-step="3">3</span><span class="t">上传</span>
      </div>
    </header>

    <!-- 第 1 步：上传码 -->
    <section class="panel" id="step1">
      <h2 class="title">输入上传码</h2>
      <p class="desc">打开小程序 → 项目详情 →「去电脑上传」→ 复制那 6 位上传码</p>

      <div class="digits" id="digits">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      </div>
      <p class="hint" id="codeHint">上传码 5 分钟内有效，过期请在小程序里刷新</p>
      <button class="btn" id="btnVerify">下一步</button>
      <p class="err" id="codeErr"></p>
    </section>

    <!-- 第 2 步：选照片 -->
    <section class="panel hidden" id="step2">
      <h2 class="title">选择照片</h2>
      <p class="desc" id="projectInfo">已绑定项目</p>

      <div id="dropZone" class="drop">
        <p class="drop-main">把照片文件夹拖到这里</p>
        <p class="drop-sub">或点击选择文件夹 · 只读取 JPG，ARW 自动跳过</p>
      </div>
      <input id="dirPicker" type="file" webkitdirectory multiple hidden>
      <input id="filePicker" type="file" accept=".jpg,.jpeg" multiple hidden>

      <div class="opts">
        <label class="opt">
          <span>预览规格</span>
          <select id="preset">
            <option value="standard" selected>标准（推荐 · 省流量）</option>
            <option value="hd">高清</option>
            <option value="hdpro">高清 Pro</option>
            <option value="raw">原画质（占用大）</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <span id="customOpts" class="hidden">
          <label class="opt">
            <span>长边</span>
            <input id="longEdge" type="number" min="1200" max="4096" step="100" value="1600">
          </label>
          <label class="opt">
            <span>质量</span>
            <input id="quality" type="range" min="40" max="95" step="1" value="75">
            <span id="qualityVal">75%</span>
          </label>
        </span>
        <label class="opt">
          <span>水印</span>
          <input id="watermark" type="text" placeholder="留空则不加" maxlength="20">
        </label>
      </div>

      <p class="summary" id="fileSummary"></p>
      <div class="row">
        <button class="btn" id="btnStart" disabled>开始上传</button>
        <button class="btn ghost hidden" id="btnClear">清空</button>
      </div>
    </section>

    <!-- 第 3 步：上传 -->
    <section class="panel hidden" id="step3">
      <h2 class="title">正在上传</h2>
      <div class="row spread">
        <span class="prog-text" id="progText">0 / 0</span>
        <span class="prog-text" id="progPct">0%</span>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <p class="summary" id="stats"></p>

      <div class="wall" id="wall"></div>

      <div class="row">
        <button class="btn ghost" id="btnRetry" disabled>重试失败项</button>
        <button class="btn ghost" id="btnBack2">继续添加</button>
      </div>
      <p class="err" id="failList"></p>
    </section>

    <!-- 完成 -->
    <section class="panel hidden" id="stepDone">
      <h2 class="title">上传完成</h2>
      <p class="desc" id="doneText"></p>
      <div class="card">
        <p class="card-t">下一步</p>
        <p class="card-d">打开小程序 → 该项目 →「② 模特」→ 邀请模特 → 发送链接</p>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnMore">继续上传</button>
        <button class="btn" id="btnFinish">完成</button>
      </div>
    </section>
  </main>

  <script src="https://web-9gikcbug35bad3a8-1304825656.tcloudbaseapp.com/sdk/1.4.0/cloud.js"></script>
  <script src="upload.js"></script>
</body>
</html>
